services:
  - type: web
    name: pixel-turf-server
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=packages/shared && npm run build --workspace=apps/server
    startCommand: npm start --workspace=apps/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://pixel-turf-teal.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Optional: set your MongoDB Atlas URI in the Render dashboard if needed
      - key: MONGODB_URI
        value: ""
